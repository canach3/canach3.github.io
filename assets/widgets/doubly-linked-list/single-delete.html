<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연결 리스트 노드 삭제 애니메이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 애니메이션 전환을 위한 CSS */
        .node, .pointer, .code-line, path {
            transition: all 0.5s ease-in-out;
        }
        .highlight-line {
            background-color: rgba(254, 240, 138, 0.5); /* Tailwind yellow-200 */
            border-left: 4px solid #eab308; /* Tailwind yellow-500 */
        }
        .code-line {
            border-left: 4px solid transparent;
            padding-left: 8px;
        }
    </style>
</head>
<body class="bg-gray-50 p-6 font-sans">

<!-- 가장 바깥 하얀색 박스 래퍼 추가 -->
<div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">

    <div class="p-6 flex flex-col gap-8">
        
        <!-- 상단: 코드 영역 -->
        <div class="w-full bg-gray-900 rounded-lg p-5 text-base font-mono text-gray-300 overflow-x-auto shadow-inner relative">
            <div id="code-0" class="code-line py-1"><span class="text-blue-400">Node</span> prev = head;</div>
            <br>
            <div id="code-1" class="code-line py-1"><span class="text-pink-500">while</span> (prev.next != targetNode) {</div>
            <div id="code-2" class="code-line py-1 pl-6">prev = prev.next; </div>
            <div class="code-line py-1">}</div>
            <br>
            <div id="code-3" class="code-line py-1">prev.next = targetNode.next;</div>
        </div>

        <!-- 하단: 시각화 영역 -->
        <div class="w-full flex flex-col justify-center">

            <!-- SVG 애니메이션 캔버스 -->
            <div class="w-full bg-white border border-gray-200 rounded-lg overflow-hidden relative" style="height: 320px;">
                <svg width="100%" height="100%" viewBox="0 0 1260 320" class="absolute top-0 left-0">
                    <defs>
                        <!-- 화살표 머리 정의 -->
                        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563" />
                        </marker>
                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
                        </marker>
                    </defs>

                    <!-- 기본 연결 화살표들 -->
                    <path id="arrow-1" d="M 170 145 L 240 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    <path id="arrow-2" d="M 370 145 L 440 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    <path id="arrow-3" d="M 570 145 L 640 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    <path id="arrow-4" d="M 770 145 L 840 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    <path id="arrow-5" d="M 970 145 L 1040 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    <path id="arrow-6" d="M 1170 145 L 1200 145" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow)" />
                    
                    <!-- 노드 건너뛰기용 곡선 화살표 (초기에는 투명) -->
                    <path id="arrow-bypass" d="M 770 145 Q 905 40 1040 145" stroke="#3B82F6" stroke-width="4" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-blue)" opacity="0" />

                    <!-- 노드 그룹 1 (head) -->
                    <g id="node-1" transform="translate(50, 120)">
                        <rect width="120" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
                        <rect x="90" y="0" width="30" height="50" fill="#E5E7EB" class="rounded-r-md border-l border-gray-400"/>
                        <circle cx="105" cy="25" r="3" fill="#4B5563" />
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#374151">10</text>
                        <!-- Head 라벨 -->
                        <text x="60" y="-15" text-anchor="middle" font-weight="bold" fill="#10B981">head</text>
                        <path d="M 60 -10 L 60 0" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
                    </g>

                    <!-- 노드 그룹 2 -->
                    <g id="node-2" transform="translate(250, 120)">
                        <rect width="120" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
                        <rect x="90" y="0" width="30" height="50" fill="#E5E7EB" class="rounded-r-md border-l border-gray-400"/>
                        <circle cx="105" cy="25" r="3" fill="#4B5563" />
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#374151">20</text>
                    </g>

                    <!-- 노드 그룹 3 -->
                    <g id="node-3" transform="translate(450, 120)">
                        <rect width="120" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
                        <rect x="90" y="0" width="30" height="50" fill="#E5E7EB" class="rounded-r-md border-l border-gray-400"/>
                        <circle cx="105" cy="25" r="3" fill="#4B5563" />
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#374151">30</text>
                    </g>

                    <!-- 노드 그룹 4 -->
                    <g id="node-4" transform="translate(650, 120)">
                        <rect width="120" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
                        <rect x="90" y="0" width="30" height="50" fill="#E5E7EB" class="rounded-r-md border-l border-gray-400"/>
                        <circle cx="105" cy="25" r="3" fill="#4B5563" />
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#374151">40</text>
                    </g>

                    <!-- 노드 그룹 5 (targetNode) -->
                    <g id="node-5" transform="translate(850, 120)">
                        <rect width="120" height="50" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
                        <rect x="90" y="0" width="30" height="50" fill="#FECACA" class="rounded-r-md border-l border-red-400"/>
                        <circle cx="105" cy="25" r="3" fill="#B91C1C" />
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#991B1B">50</text>
                        <!-- Target 라벨 -->
                        <g transform="translate(60, -35)">
                            <text x="0" y="0" text-anchor="middle" font-weight="bold" fill="#EF4444">targetNode</text>
                            <path d="M 0 5 L 0 25" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
                        </g>
                    </g>

                    <!-- 노드 그룹 6 (null) -->
                    <g id="node-6" transform="translate(1050, 120)">
                        <rect width="120" height="50" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
                        <rect x="90" y="0" width="30" height="50" fill="#E5E7EB" class="rounded-r-md border-l border-gray-400"/>
                        <text x="105" y="30" text-anchor="middle" font-size="12" fill="#6B7280">null</text>
                        <text x="45" y="31" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" fill="#374151">60</text>
                    </g>

                    <!-- Prev 포인터 (동적으로 움직임) -->
                    <g id="pointer-prev" class="pointer" transform="translate(110, 220)" opacity="0">
                        <path d="M 0 0 L 0 -25" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow-blue)"/>
                        <rect x="-30" y="0" width="60" height="26" rx="4" fill="#3B82F6" />
                        <text x="0" y="18" text-anchor="middle" font-weight="bold" fill="white" font-size="14">prev</text>
                    </g>
                </svg>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="mt-6 flex justify-between items-center">
                <div class="flex gap-2">
                    <button id="btn-reset" onclick="setStep(0)" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-md font-medium transition-colors">
                        처음부터
                    </button>
                    <button id="btn-prev" onclick="changeStep(-1)" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-md font-medium transition-colors" disabled>
                        이전
                    </button>
                    <button id="btn-next" onclick="changeStep(1)" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium transition-colors shadow-md">
                        다음 단계
                    </button>
                </div>
                <div class="text-gray-500 font-medium">
                    Step: <span id="step-indicator" class="text-blue-600 font-bold">0</span> / 9
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentStep = 0;
    const maxStep = 9;

    // 각 스텝별 상태 정의 (설명 문구 제거 및 총 9개의 스텝으로 세분화)
    const stepsData = [
        { codeLine: null, prevOpacity: 0, prevX: 110, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 0, prevOpacity: 1, prevX: 110, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 1, prevOpacity: 1, prevX: 110, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 2, prevOpacity: 1, prevX: 310, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 1, prevOpacity: 1, prevX: 310, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 2, prevOpacity: 1, prevX: 510, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 1, prevOpacity: 1, prevX: 510, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 2, prevOpacity: 1, prevX: 710, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 1, prevOpacity: 1, prevX: 710, node5Opacity: 1, arrow4Opacity: 1, arrow5Opacity: 1, bypassOpacity: 0 },
        { codeLine: 3, prevOpacity: 1, prevX: 710, node5Opacity: 0.4, arrow4Opacity: 0.2, arrow5Opacity: 0.2, bypassOpacity: 1 }
    ];

    function changeStep(delta) {
        let newStep = currentStep + delta;
        if (newStep >= 0 && newStep <= maxStep) {
            setStep(newStep);
        }
    }

    function setStep(step) {
        currentStep = step;
        const data = stepsData[step];

        // 1. 코드 하이라이트 업데이트
        for (let i = 0; i <= 3; i++) {
            const line = document.getElementById(`code-${i}`);
            if (line) {
                if (data.codeLine === i) {
                    line.classList.add('highlight-line');
                } else {
                    line.classList.remove('highlight-line');
                }
            }
        }

        // 2. SVG 애니메이션 업데이트
        const pointerPrev = document.getElementById('pointer-prev');
        pointerPrev.setAttribute('opacity', data.prevOpacity);
        pointerPrev.setAttribute('transform', `translate(${data.prevX}, 210)`);

        document.getElementById('node-5').style.opacity = data.node5Opacity;
        document.getElementById('arrow-4').style.opacity = data.arrow4Opacity;
        document.getElementById('arrow-5').style.opacity = data.arrow5Opacity;
        
        // 우회 화살표
        const bypass = document.getElementById('arrow-bypass');
        bypass.setAttribute('opacity', data.bypassOpacity);
        if(data.bypassOpacity > 0) {
            bypass.style.strokeDasharray = "none";
        } else {
             bypass.style.strokeDasharray = "5,5";
        }

        // 3. 컨트롤 버튼 상태 업데이트
        document.getElementById('btn-prev').disabled = (step === 0);
        document.getElementById('btn-next').disabled = (step === maxStep);
        
        // 4. 스텝 텍스트 업데이트
        document.getElementById('step-indicator').innerText = step;
    }

    // 초기화
    setStep(0);
</script>

</body>
</html>
