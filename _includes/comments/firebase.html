<style>
  .comments-container {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--main-border-color, #e1e4e8);
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      Arial, sans-serif;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
  .comments-header {
    margin-bottom: 1.5rem;
  }
  .comments-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-color, #24292e);
    margin: 0;
  }
  .comments-count {
    color: var(--text-muted-color, #6a737d);
    font-weight: 400;
    font-size: 1rem;
    margin-left: 0.25rem;
  }
  .comment-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background-color: var(--main-border-color, #e1e4e8);
  }
  .form-inner {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .comment-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--main-border-color, #e1e4e8);
    border-radius: 8px;
    background-color: var(--main-bg, #ffffff);
    color: var(--text-color, #24292e);
    font-size: 0.95rem;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    box-sizing: border-box;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }
  .comment-input::placeholder {
    font-family: inherit;
  }
  .comment-input:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
  }
  .btn-submit {
    padding: 0.5rem 1.25rem;
    background-color: var(--btn-bg-color, #24292e);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .btn-submit:hover {
    background-color: var(--btn-hover-color, #0366d6);
  }

  /* 댓글 및 답글 리스트 구조 */
  .comment-list,
  .reply-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .reply-list {
    margin-top: 1rem;
    padding-left: 3.5rem;
    border-left: 2px solid var(--main-border-color, #e1e4e8);
  }
  .comment-item {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .comment-content {
    flex-grow: 1;
    width: 100%;
  }
  .comment-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }
  .comment-author {
    font-weight: 600;
    color: var(--text-color, #24292e);
    font-size: 0.95rem;
  }
  .badge-author {
    background-color: #6c757d;
    color: white;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .comment-date {
    color: var(--text-muted-color, #6a737d);
    font-size: 0.85rem;
  }
  .comment-text {
    margin: 0.25rem 0 0.5rem 0;
    color: var(--text-color, #24292e);
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-all;
  }

  /* 액션 버튼들 (답글, 수정, 삭제) */
  .comment-actions {
    display: flex;
    gap: 1rem;
  }
  .btn-action {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-muted-color, #6a737d);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .btn-action:hover {
    color: var(--link-color, #007bff);
    text-decoration: underline;
  }
  .btn-danger:hover {
    color: #dc3545; /* 빨간색 포인트 */
  }

  /* 인라인 폼 (답글 작성 & 수정용) */
  .inline-form-container {
    margin-top: 1rem;
  }
  .inline-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  /* 인증 UI */
  .comment-writing-section {
    margin-bottom: 2.5rem;
  }
  .comment-form-wrapper {
    display: flex;
    gap: 1rem;
  }
  .auth-tabs {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--main-border-color, #e1e4e8);
  }
  .auth-tab {
    background: none;
    border: none;
    padding: 0.5rem 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-muted-color, #6a737d);
    cursor: pointer;
    position: relative;
    transition: color 0.2s ease;
  }
  .auth-tab:hover,
  .auth-tab.active {
    color: var(--text-color, #24292e);
  }
  .auth-tab.active::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--text-color, #24292e);
  }
  .auth-area {
    margin-bottom: 0.75rem;
  }
  .social-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .btn-social {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--main-border-color, #e1e4e8);
    border-radius: 6px;
    background-color: var(--main-bg, #ffffff);
    color: var(--text-color, #24292e);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .btn-social:hover {
    background-color: var(--main-border-color, #e1e4e8);
  }
  .logged-in-text {
    font-size: 0.9rem;
    color: var(--text-color, #24292e);
  }
  .btn-logout {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-muted-color, #6a737d);
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .anonymous-inputs {
    display: flex;
    gap: 0.5rem;
  }
  .anon-input {
    flex: 1;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--main-border-color, #e1e4e8);
    border-radius: 6px;
    background-color: var(--main-bg, #ffffff);
    color: var(--text-color, #24292e);
    font-size: 0.9rem;
  }
  .anon-input:focus {
    outline: none;
    border-color: #007bff;
  }
  .comment-input:disabled,
  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background-color: var(--main-border-color, #e1e4e8);
  }
  [data-mode="dark"] .comments-container {
    --main-border-color: #3e3e42;
    --text-color: #d1d5da;
    --text-muted-color: #8b949e;
    --main-bg: #212121;
    --btn-bg-color: #3e3e42;
    --btn-hover-color: #58a6ff;
    --link-color: #58a6ff;
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import {
    getAuth,
    signInWithPopup,
    GoogleAuthProvider,
    GithubAuthProvider,
    signInAnonymously,
    onAuthStateChanged,
    signOut,
  } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    doc,
    deleteDoc,
    updateDoc,
  } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZT1G_bZ0nkBhFLLqL7BZBjNaDVNV_4Zo",
    authDomain: "canacode-comments.firebaseapp.com",
    projectId: "canacode-comments",
    storageBucket: "canacode-comments.firebasestorage.app",
    messagingSenderId: "800456034298",
    appId: "1:800456034298:web:8954c73377c95499ab8643",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const postId = "{{ page.url }}";
  const defaultAvatar =
    "https://ui-avatars.com/api/?name=U&background=f0f0f0&color=333";

  /* DOM 요소 */
  const tabs = document.querySelectorAll(".auth-tab");
  const socialArea = document.getElementById("social-area");
  const anonymousArea = document.getElementById("anonymous-area");
  const textarea = document.getElementById("comment-textarea");
  const submitBtn = document.getElementById("btn-submit-comment");
  const avatar = document.getElementById("form-avatar");

  const socialPrompt = document.getElementById("social-login-prompt");
  const socialUserInfo = document.getElementById("social-user-info");
  const currentUsername = document.getElementById("current-username");
  const anonNickname = document.getElementById("anon-nickname");
  const anonPassword = document.getElementById("anon-password");

  const commentsList = document.getElementById("comments-list-ul");
  const commentCountEl = document.getElementById("comment-count");

  let currentTab = "social";
  let currentUser = null;
  let commentsData =
    []; /* 로드된 전체 댓글을 메모리에 저장 (비밀번호 대조 등 활용) */

  /* 1. 탭 전환 및 UI 업데이트 로직 */
  tabs.forEach((tab) => {
    tab.addEventListener("click", (e) => {
      tabs.forEach((t) => t.classList.remove("active"));
      e.target.classList.add("active");
      currentTab = e.target.getAttribute("data-type");
      updateUI();
    });
  });

  function updateUI() {
    if (currentTab === "social") {
      socialArea.style.display = "block";
      anonymousArea.style.display = "none";
      if (currentUser && !currentUser.isAnonymous) {
        socialPrompt.style.display = "none";
        socialUserInfo.style.display = "flex";
        currentUsername.textContent = currentUser.displayName || "User";
        avatar.src =
          currentUser.photoURL ||
          `https://ui-avatars.com/api/?name=${currentUser.displayName}&background=random`;
        toggleInputState(true);
      } else {
        socialPrompt.style.display = "flex";
        socialUserInfo.style.display = "none";
        avatar.src = defaultAvatar;
        toggleInputState(false);
      }
    } else {
      socialArea.style.display = "none";
      anonymousArea.style.display = "block";
      avatar.src = defaultAvatar;
      toggleInputState(true);
    }
    window.dispatchEvent(new Event("resize"));
  }

  function toggleInputState(isEnabled) {
    if (isEnabled) {
      textarea.removeAttribute("disabled");
      submitBtn.removeAttribute("disabled");
      textarea.placeholder = "댓글 남기기";
    } else {
      textarea.setAttribute("disabled", "true");
      submitBtn.setAttribute("disabled", "true");
      textarea.placeholder = "소셜 계정으로 로그인 후 댓글을 남길 수 있습니다.";
    }
  }

  /* 2. 인증 설정 */
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    updateUI();
  });

  document.getElementById("btn-google-login").addEventListener("click", () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(console.error);
  });
  document.getElementById("btn-github-login").addEventListener("click", () => {
    signInWithPopup(auth, new GithubAuthProvider()).catch(console.error);
  });
  document
    .getElementById("btn-logout")
    .addEventListener("click", () => signOut(auth));

  /* 특수문자 이스케이프 함수 */
  const escapeHtml = (unsafe) => {
    return (unsafe || "")
      .toString()
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  };

  /* 3. 작성자 인증 정보 가져오기 (공통 함수) */
  async function getAuthorData() {
    if (currentTab === "social") {
      if (!currentUser || currentUser.isAnonymous)
        throw new Error("로그인이 필요합니다.");
      return {
        uid: currentUser.uid,
        displayName: currentUser.displayName || "Social User",
        photoURL: currentUser.photoURL || null,
        isAnonymous: false,
      };
    } else {
      const nickname = anonNickname.value.trim();
      const password = anonPassword.value.trim();
      if (!nickname || !password)
        throw new Error("닉네임과 비밀번호를 모두 입력해주세요.");

      let anonUid = currentUser ? currentUser.uid : null;
      if (!anonUid || (currentUser && !currentUser.isAnonymous)) {
        const userCredential = await signInAnonymously(auth);
        anonUid = userCredential.user.uid;
      }
      return {
        uid: anonUid,
        displayName: nickname,
        photoURL: `https://ui-avatars.com/api/?name=${encodeURIComponent(nickname)}&background=random`,
        isAnonymous: true,
        password: password,
      };
    }
  }

  /* 4. 실시간 댓글 렌더링 */
  const q = query(
    collection(db, "comments"),
    where("postId", "==", postId),
    orderBy("createdAt", "asc"),
  );

  onSnapshot(q, (snapshot) => {
    commentsList.innerHTML = "";
    commentsData = [];

    snapshot.forEach((doc) => commentsData.push({ id: doc.id, ...doc.data() }));
    commentCountEl.textContent = commentsData.length;

    if (commentsData.length === 0) {
      commentsList.innerHTML =
        '<li class="comment-item" style="color: var(--text-muted-color); text-align: center; width:100%; padding: 20px;">첫 댓글을 남겨주세요!</li>';
      window.dispatchEvent(new Event("resize"));
      return;
    }

    /* 최상단 댓글과 답글 분리 */
    const topLevelComments = commentsData.filter((c) => !c.parentId);
    const replies = commentsData.filter((c) => c.parentId);

    /* 공통 렌더링 함수 */
    const renderCommentHTML = (data, isReply = false) => {
      const dateStr = data.createdAt
        ? data.createdAt.toDate().toLocaleString()
        : "방금 전";
      const isOwner =
        currentUser && !currentUser.isAnonymous && currentUser.uid === data.uid;

      let actionBtns = "";
      if (!isReply) {
        actionBtns += `<button type="button" class="btn-action btn-reply" data-id="${data.id}">답글 달기</button>`;
      }
      /* 소셜 본인 댓글이거나 익명 댓글인 경우 수정/삭제 노출 */
      if (isOwner || data.isAnonymous) {
        actionBtns += `
          <button type="button" class="btn-action btn-edit" data-id="${data.id}">수정</button>
          <button type="button" class="btn-action btn-danger btn-delete" data-id="${data.id}" data-anon="${data.isAnonymous}">삭제</button>
        `;
      }

      return `
        <li class="comment-item" id="comment-${data.id}">
          <img src="${escapeHtml(data.photoURL) || defaultAvatar}" alt="Avatar" class="comment-avatar" ${isReply ? 'style="width: 32px; height: 32px;"' : ""}>
          <div class="comment-content">
            <div class="comment-meta">
              <span class="comment-author">${escapeHtml(data.displayName)}</span>
              ${data.isAnonymous ? '<span class="badge-author">익명</span>' : ""}
              <span class="comment-date">${dateStr}</span>
            </div>
            <div class="comment-text-container" id="text-container-${data.id}">
              <p class="comment-text">${escapeHtml(data.content).replace(/\n/g, "<br>")}</p>
            </div>
            <div class="comment-actions" id="actions-${data.id}">${actionBtns}</div>
            
            <div id="reply-form-${data.id}"></div>
            ${!isReply ? `<ul class="reply-list" id="replies-${data.id}"></ul>` : ""}
          </div>
        </li>
      `;
    };

    /* 최상단 댓글 렌더링 */
    topLevelComments.forEach((c) =>
      commentsList.insertAdjacentHTML("beforeend", renderCommentHTML(c, false)),
    );

    /* 답글 렌더링 (해당 부모 ul 안에 삽입) */
    replies.forEach((r) => {
      const parentUl = document.getElementById(`replies-${r.parentId}`);
      if (parentUl) {
        parentUl.insertAdjacentHTML("beforeend", renderCommentHTML(r, true));
      }
    });

    window.dispatchEvent(new Event("resize"));
  });

  /* 5. 최상단 댓글 작성 이벤트 */
  submitBtn.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text) return alert("댓글 내용을 입력하세요.");

    submitBtn.disabled = true;
    submitBtn.textContent = "등록 중...";

    try {
      const authorData = await getAuthorData();
      const docData = {
        postId: postId,
        content: text,
        createdAt: serverTimestamp(),
        ...authorData,
      };
      await addDoc(collection(db, "comments"), docData);
      textarea.value = "";
      if (currentTab === "anonymous") {
        anonNickname.value = "";
        anonPassword.value = "";
      }
    } catch (error) {
      if (error.message) alert(error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "댓글 남기기";
    }
  });

  /* 6. 답글, 수정, 삭제 이벤트 위임 (Event Delegation) */
  commentsList.addEventListener("click", async (e) => {
    const target = e.target;
    if (
      !target.classList.contains("btn-action") &&
      !target.classList.contains("btn-submit")
    )
      return;

    const id =
      target.getAttribute("data-id") || target.getAttribute("data-parent");
    const comment = commentsData.find((c) => c.id === id);

    /* 6-1. 삭제 */
    if (target.classList.contains("btn-delete")) {
      if (comment.isAnonymous) {
        const pwd = prompt("익명 댓글을 삭제하려면 비밀번호를 입력하세요.");
        if (pwd === null) return;
        if (pwd !== comment.password)
          return alert("비밀번호가 일치하지 않습니다.");
      } else {
        if (!confirm("정말 삭제하시겠습니까?")) return;
      }
      try {
        await deleteDoc(doc(db, "comments", id));
      } catch (err) {
        alert("삭제 중 오류가 발생했습니다.");
      }
      return;
    }

    /* 6-2. 답글 달기 폼 토글 */
    if (target.classList.contains("btn-reply")) {
      const formContainer = document.getElementById(`reply-form-${id}`);
      if (formContainer.innerHTML !== "") {
        formContainer.innerHTML = ""; /* 닫기 */
      } else {
        formContainer.innerHTML = `
          <div class="inline-form-container">
            <textarea class="comment-input" id="reply-input-${id}" placeholder="답글을 남겨보세요" rows="2"></textarea>
            <div class="inline-form-actions">
              <button class="btn-submit btn-submit-reply" data-parent="${id}">답글 등록</button>
            </div>
          </div>
        `;
      }
      return;
    }

    /* 6-3. 답글 등록 처리 */
    if (target.classList.contains("btn-submit-reply")) {
      const parentId = target.getAttribute("data-parent");
      const replyText = document
        .getElementById(`reply-input-${parentId}`)
        .value.trim();
      if (!replyText) return alert("답글 내용을 입력하세요.");

      target.disabled = true;
      target.textContent = "등록 중...";
      try {
        const authorData = await getAuthorData();
        const docData = {
          postId: postId,
          content: replyText,
          createdAt: serverTimestamp(),
          parentId: parentId /* 부모 ID 지정 */,
          ...authorData,
        };
        await addDoc(collection(db, "comments"), docData);
      } catch (err) {
        if (err.message) alert(err.message);
        target.disabled = false;
        target.textContent = "답글 등록";
      }
      return;
    }

    /* 6-4. 수정 폼 열기 */
    if (target.classList.contains("btn-edit")) {
      if (comment.isAnonymous) {
        const pwd = prompt("익명 댓글을 수정하려면 비밀번호를 입력하세요.");
        if (pwd === null) return;
        if (pwd !== comment.password)
          return alert("비밀번호가 일치하지 않습니다.");
      }
      const textContainer = document.getElementById(`text-container-${id}`);
      const actionsContainer = document.getElementById(`actions-${id}`);

      actionsContainer.style.display = "none";
      textContainer.innerHTML = `
        <div class="inline-form-container" style="margin-top: 0;">
          <textarea class="comment-input" id="edit-input-${id}" rows="2">${escapeHtml(comment.content)}</textarea>
          <div class="inline-form-actions">
            <button class="btn-action btn-cancel-edit" data-id="${id}">취소</button>
            <button class="btn-submit btn-save-edit" data-id="${id}">저장</button>
          </div>
        </div>
      `;
      return;
    }

    /* 6-5. 수정 취소 */
    if (target.classList.contains("btn-cancel-edit")) {
      const textContainer = document.getElementById(`text-container-${id}`);
      const actionsContainer = document.getElementById(`actions-${id}`);
      textContainer.innerHTML = `<p class="comment-text">${escapeHtml(comment.content).replace(/\n/g, "<br>")}</p>`;
      actionsContainer.style.display = "flex";
      return;
    }

    /* 6-6. 수정 저장 */
    if (target.classList.contains("btn-save-edit")) {
      const newText = document.getElementById(`edit-input-${id}`).value.trim();
      if (!newText) return alert("내용을 입력하세요.");

      target.disabled = true;
      target.textContent = "저장 중...";
      try {
        await updateDoc(doc(db, "comments", id), { content: newText });
        /* 성공 시 onSnapshot이 UI를 자동 갱신합니다. */
      } catch (err) {
        alert("수정 중 오류가 발생했습니다.");
        target.disabled = false;
        target.textContent = "저장";
      }
    }
  });
</script>
