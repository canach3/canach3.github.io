<style>
  /* 기본 컨테이너 스타일 */
  .comments-container {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--main-border-color, #e1e4e8);
    width: 100%;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    box-sizing: border-box;
    font-family: inherit;
  }
  .comments-header { margin-bottom: 2rem; }
  
  /* 헤더 (댓글 개수 등) */
  .comments-title { 
    font-size: 1.25rem; font-weight: 700; color: var(--text-color, #0f1419); margin: 0; 
    user-select: none; cursor: pointer; display: inline-block;
  }
  .comments-count { color: var(--text-muted-color, #606060); font-weight: 500; font-size: 1.1rem; margin-left: 0.4rem; }
  
  /* 아바타 이미지용 (관리자용) */
  .comment-avatar { 
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; 
    background-color: var(--main-bg, #ffffff);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); 
  }

  /* --- 구글/유튜브 스타일 CSS 순수 텍스트 아바타 --- */
  .css-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; font-weight: 600; font-size: 1.1rem;
    flex-shrink: 0; text-transform: uppercase; user-select: none;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .reply-item .css-avatar {
    width: 28px; height: 28px; font-size: 0.8rem;
  }
  
  /* 작성 폼 스타일 */
  .form-inner { flex-grow: 1; display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .comment-input { 
    width: 100%; padding: 0.75rem 0; border: none; border-bottom: 1px solid var(--main-border-color, #e1e4e8); 
    border-radius: 0; background-color: transparent; color: var(--text-color, #0f1419); 
    font-size: 0.95rem; line-height: 1.5; resize: vertical; box-sizing: border-box; 
    transition: border-color 0.2s ease; font-family: inherit;
  }
  .comment-input:focus { outline: none; border-bottom: 2px solid var(--text-color, #0f1419); } 
  
  .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  
  /* 버튼 스타일: 채도를 낮춘 차분한 다크 블루/그레이톤 */
  .btn-submit { 
    padding: 0.5rem 1rem; 
    background-color: #24292e; /* 기존 쨍한 파란색에서 다크 톤으로 변경 */
    color: #ffffff; 
    border: none; 
    border-radius: 18px; 
    font-size: 0.85rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: background-color 0.2s ease, opacity 0.2s ease;
  }
  .btn-submit:hover { 
    background-color: #1b1f23; /* 호버 시 더 어두운 톤 */
    opacity: 0.9;
  }
  
  /* 익명 정보 입력란 */
  .anonymous-inputs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
  .anon-input { 
    flex: 1; min-width: 130px; padding: 0.5rem 0.75rem; border: 1px solid var(--main-border-color, #e1e4e8); 
    border-radius: 6px; background-color: var(--main-bg, #ffffff); color: var(--text-color, #0f1419); font-size: 0.85rem; 
  }
  .anon-input:focus { outline: none; border-color: var(--text-color, #0f1419); }
  
  /* 로그인 상태 텍스트 (관리자용) */
  .admin-status-text { font-size: 0.85rem; color: #065fd4; font-weight: 600; display: none; }
  .btn-logout { background: none; border: none; padding: 0; color: var(--text-muted-color, #606060); font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-left: 0.5rem; }

  /* 댓글 리스트 및 아이템 스타일 */
  .comment-list { list-style: none; padding: 0; margin: 0; }
  .comment-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
  .comment-content { flex-grow: 1; min-width: 0; }
  
  /* 메타 정보 (작성자명, 뱃지, 날짜) */
  .comment-meta { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.2rem; flex-wrap: wrap; }
  .comment-author { font-weight: 600; color: var(--text-color, #0f1419); font-size: 0.85rem; }
  
  /* 작성자(어드민) 뱃지 */
  .badge-owner { 
    background-color: var(--text-color, #0f1419); color: var(--main-bg, #ffffff); 
    padding: 0.1rem 0.5rem; border-radius: 12px; font-size: 0.7rem; font-weight: 600; 
  }
  
  .comment-date { color: var(--text-muted-color, #606060); font-size: 0.75rem; font-weight: 400; }
  .comment-text { margin: 0; color: var(--text-color, #0f1419); font-size: 0.95rem; line-height: 1.5; word-break: break-all; overflow-wrap: break-word; }
  
  /* 수정/삭제/답글 버튼 */
  .comment-actions { display: flex; gap: 1rem; margin-top: 0.4rem; align-items: center; }
  .btn-action-text { 
    background: none; border: none; padding: 0.3rem 0.5rem; margin-left: -0.5rem; 
    color: var(--text-muted-color, #606060); font-size: 0.8rem; font-weight: 600; 
    cursor: pointer; transition: color 0.2s ease, background-color 0.2s ease; border-radius: 12px;
  }
  .btn-action-text:hover { color: var(--text-color, #0f1419); background-color: rgba(0,0,0,0.05); text-decoration: none; }
  .edit-area { display: none; margin-top: 0.5rem; }
  
  /* 대댓글 스타일 */
  .reply-container { margin-top: 0.5rem; padding-left: 0; display: flex; flex-direction: column; gap: 1rem; }
  .reply-item { display: flex; gap: 0.8rem; }
  .reply-item .comment-avatar { width: 28px; height: 28px; }
  .reply-item .comment-text { font-size: 0.9rem; margin-bottom: 0.2rem; }
  .reply-form-wrapper { display: none; margin-top: 0.75rem; padding-bottom: 1rem; }

  /* 버튼 비활성화 상태 */
  .comment-input:disabled, .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; background-color: var(--main-border-color, #e1e4e8); }

  /* 더보기 버튼 스타일: 차분한 텍스트 컬러 */
  .btn-load-more {
    padding: 0.6rem 1.5rem; 
    background-color: transparent; 
    color: var(--text-color, #24292e); /* 테마 기본 텍스트 색상 사용 */
    border: 1px solid var(--main-border-color, #e1e4e8); /* 테두리 추가로 뚜렷하게 */
    border-radius: 18px; 
    font-size: 0.9rem; 
    font-weight: 600;
    font-family: inherit; 
    cursor: pointer; 
    transition: background-color 0.2s ease;
  }
  .btn-load-more:hover { 
    background-color: rgba(0, 0, 0, 0.05); 
  }
  
  /* --- 다크모드 변수 매핑 --- */
  [data-mode="dark"] .comments-container, [data-mode="dark"] .pwd-modal {
    --main-border-color: #3e3e42; --text-color: #f1f1f1; --text-muted-color: #aaaaaa; --main-bg: #212121;
  }
  [data-mode="dark"] .btn-submit { background-color: #3ea6ff; color: #0f0f0f; }
  [data-mode="dark"] .btn-submit:hover { background-color: #65b8ff; }
  [data-mode="dark"] .badge-owner { background-color: #f1f1f1; color: #0f0f0f; }
  [data-mode="dark"] .btn-action-text:hover { background-color: rgba(255,255,255,0.1); color: #f1f1f1; }
  [data-mode="dark"] .btn-load-more { color: #3ea6ff; }
  [data-mode="dark"] .btn-load-more:hover { background-color: rgba(62, 166, 255, 0.15); }
  [data-mode="dark"] .admin-status-text { color: #3ea6ff; }

  /* 비밀번호 모달 */
  .pwd-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .pwd-modal { background: var(--main-bg, #ffffff); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); width: 300px; max-width: 90%; text-align: center; border: 1px solid var(--main-border-color, #e1e4e8); }
  .pwd-modal h4 { margin-top: 0; margin-bottom: 1rem; color: var(--text-color, #0f1419); font-size: 1.1rem; font-weight: 600;}
  .pwd-modal input { width: 100%; margin-bottom: 1rem; padding: 0.6rem 0.75rem; box-sizing: border-box; border: 1px solid var(--main-border-color, #e1e4e8); border-radius: 6px; background-color: transparent; color: var(--text-color, #0f1419); }
  .pwd-modal input:focus { outline: none; border-color: #065fd4; }
  .pwd-modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }

  /* 폰트 상속 */
  .comment-input, .anon-input, .btn-submit, .btn-action-text { font-family: inherit !important; }
  .comment-input::placeholder, .anon-input::placeholder { font-family: inherit !important; }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAZT1G_bZ0nkBhFLLqL7BZBjNaDVNV_4Zo",
    authDomain: "canacode-comments.firebaseapp.com",
    projectId: "canacode-comments",
    storageBucket: "canacode-comments.firebasestorage.app",
    messagingSenderId: "800456034298",
    appId: "1:800456034298:web:8954c73377c95499ab8643"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const postId = "{{ page.url }}";
  const ADMIN_AVATAR = "/assets/img/profile.png";
  const ADMIN_EMAIL = "canach3@gmail.com";

  const anonymousArea = document.getElementById("anonymous-area");
  const textarea = document.getElementById("comment-textarea");
  const submitBtn = document.getElementById("btn-submit-comment");
  const adminStatus = document.getElementById("admin-status");
  const currentUserAvatarContainer = document.getElementById("current-user-avatar-container");

  const anonNickname = document.getElementById("anon-nickname");
  const anonPassword = document.getElementById("anon-password");
  const anonEmail = document.getElementById("anon-email");
  const commentsList = document.getElementById("comments-list-ul");
  const commentCountEl = document.getElementById("comment-count");
  const hiddenAdminTrigger = document.getElementById("hidden-admin-trigger");

  let currentUser = null;

  hiddenAdminTrigger.addEventListener("dblclick", () => {
    if (!currentUser || currentUser.isAnonymous) {
      signInWithPopup(auth, new GoogleAuthProvider()).then((result) => {
        if (result.user.email !== ADMIN_EMAIL) {
          alert("해당 블로그 주인이 아닙니다.");
          signOut(auth);
        } else {
          console.log("관리자 로그인 성공");
        }
      }).catch(err => console.error(err));
    }
  });

  document.getElementById("btn-logout").addEventListener("click", () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user && !user.isAnonymous && user.email === ADMIN_EMAIL) {
      adminStatus.style.display = "inline-block";
      anonymousArea.style.display = "none";
      currentUserAvatarContainer.innerHTML = `<img src="${ADMIN_AVATAR}" class="comment-avatar" alt="Avatar" />`;
    } else {
      adminStatus.style.display = "none";
      anonymousArea.style.display = "block";
      currentUserAvatarContainer.innerHTML = `<div class="css-avatar" style="background-color: #9ca3af;">U</div>`;
    }
  });

  const escapeHtml = (unsafe) => {
    return (unsafe || "").toString()
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  };

  function timeAgo(date) {
    if (!date) return "방금 전";
    const seconds = Math.floor((new Date() - date) / 1000);
    let interval = seconds / 31536000;
    if (interval > 1) return Math.floor(interval) + "년 전";
    interval = seconds / 2592000;
    if (interval > 1) return Math.floor(interval) + "개월 전";
    interval = seconds / 86400;
    if (interval > 1) return Math.floor(interval) + "일 전";
    interval = seconds / 3600;
    if (interval > 1) return Math.floor(interval) + "시간 전";
    interval = seconds / 60;
    if (interval > 1) return Math.floor(interval) + "분 전";
    return "방금 전";
  }

  function askPassword() {
    return new Promise((resolve) => {
      const modal = document.getElementById('pwd-modal');
      const input = document.getElementById('modal-pwd-input');
      const cancelBtn = document.getElementById('modal-pwd-cancel');
      const confirmBtn = document.getElementById('modal-pwd-confirm');

      input.value = '';
      modal.style.display = 'flex';
      input.focus();

      const cleanup = () => {
        modal.style.display = 'none';
        cancelBtn.onclick = null;
        confirmBtn.onclick = null;
        input.onkeydown = null;
      };

      cancelBtn.onclick = () => { cleanup(); resolve(null); };
      confirmBtn.onclick = () => { cleanup(); resolve(input.value); };
      input.onkeydown = (e) => {
        if (e.key === 'Enter') { cleanup(); resolve(input.value); } 
        else if (e.key === 'Escape') { cleanup(); resolve(null); }
      };
    });
  }

  /* --- 닉네임 기반으로 구글/유튜브 스타일 CSS 아바타 생성 함수 --- */
  function getAvatarHtml(isAdmin, displayName, isReply = false) {
    if (isAdmin) {
      const sizeStyle = isReply ? 'style="width: 28px; height: 28px;"' : '';
      return `<img src="${ADMIN_AVATAR}" class="comment-avatar" alt="Admin Avatar" ${sizeStyle}>`;
    }
    
    const name = displayName ? displayName.trim() : 'U';
    const initial = name.charAt(0).toUpperCase(); /* 첫 글자 추출 */
    
    /* 닉네임을 해시하여 예쁘고 세련된 색상 배열 중 하나를 무작위로 고정 선택 */
    const colors = ['#1d4ed8', '#0369a1', '#0f766e', '#4d7c0f', '#b45309', '#b91c1c', '#be185d', '#7e22ce', '#4338ca', '#334155'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    const colorIndex = Math.abs(hash) % colors.length;
    const bgColor = colors[colorIndex];
    
    const sizeStyle = isReply ? 'width: 28px; height: 28px; font-size: 0.8rem;' : '';
    
    return `<div class="css-avatar" style="background-color: ${bgColor}; ${sizeStyle}">${initial}</div>`;
  }

  window.toggleReplyForm = function(id) {
    const form = document.getElementById("reply-form-" + id);
    form.style.display = form.style.display === "block" ? "none" : "block";
  };

  window.startEdit = function(id) {
    document.getElementById("text-" + id).style.display = "none";
    document.getElementById("edit-area-" + id).style.display = "block";
  };

  window.cancelEdit = function(id) {
    document.getElementById("text-" + id).style.display = "block";
    document.getElementById("edit-area-" + id).style.display = "none";
  };

  window.submitReply = async function(parentId) {
    const replyInput = document.getElementById("reply-input-" + parentId);
    const text = replyInput.value.trim();
    if (!text) return alert("내용을 입력하세요.");

    let replierName = "익명 사용자";
    let currentReplierEmail = "";
    const isAdminUser = currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL;
    
    if (isAdminUser) {
      replierName = "카나코드";
      currentReplierEmail = ADMIN_EMAIL;
    } else {
      const inputNick = document.getElementById(`reply-nickname-${parentId}`);
      if (inputNick && inputNick.value.trim()) replierName = inputNick.value.trim();
      
      const inputEmail = document.getElementById(`reply-email-${parentId}`);
      if (inputEmail && inputEmail.value.trim()) currentReplierEmail = inputEmail.value.trim();
    }

    await processCommentSubmission(text, parentId, async () => {
      replyInput.value = "";
      window.toggleReplyForm(parentId);

      try {
        const parentDoc = await getDoc(doc(db, "comments", parentId));
        const repliesQuery = query(collection(db, "comments"), where("parentId", "==", parentId));
        const repliesSnap = await getDocs(repliesQuery);

        const targetUsers = new Map();
        if (parentDoc.exists() && parentDoc.data().email) targetUsers.set(parentDoc.data().email, parentDoc.data().displayName);
        
        repliesSnap.forEach((d) => { if (d.data().email) targetUsers.set(d.data().email, d.data().displayName); });

        targetUsers.set(ADMIN_EMAIL, "카나코드");
        targetUsers.delete(currentReplierEmail);

        if (targetUsers.size > 0) {
          const emailPromises = Array.from(targetUsers.entries()).map(([email, name]) => {
            const templateParams = { to_email: email, to_name: name, reply_name: replierName, reply_content: text, post_link: window.location.href };
            return emailjs.send("service_n6vjcvi", "template_s4as7uj", templateParams);
          });
          await Promise.all(emailPromises);
        }
      } catch (e) { console.error("알림 에러:", e); }
    });
  };

  window.saveEdit = async function(id) {
    const newContent = document.getElementById("edit-input-" + id).value.trim();
    if (!newContent) return alert("내용을 입력해주세요.");

    const docRef = doc(db, "comments", id);
    let pwd = null;
    const isAdminUser = currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL;

    if (!isAdminUser) { pwd = await askPassword(); if (!pwd) return; }

    try {
      /* 새 시크릿 탭 등에서 로그인 세션이 끊겨있다면 즉석에서 익명 로그인 */
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.isAdmin && !isAdminUser) return alert("관리자만 수정할 수 있습니다.");
        if (!data.isAdmin && data.password !== pwd && !isAdminUser) return alert("비밀번호가 일치하지 않습니다.");
        await updateDoc(docRef, { content: newContent });
        cancelEdit(id);
      }
    } catch(e) { 
      console.error("수정 에러:", e);
      alert("데이터 조회 오류 또는 권한이 없습니다."); 
    }
  };

  window.confirmDelete = async function(id) {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    const docRef = doc(db, "comments", id);
    let pwd = null;
    const isAdminUser = currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL;

    if (!isAdminUser) { pwd = await askPassword(); if (!pwd) return; }

    try {
      /* 새 시크릿 탭 등에서 로그인 세션이 끊겨있다면 즉석에서 익명 로그인 */
      if (!auth.currentUser) {
        await signInAnonymously(auth);
      }

      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.isAdmin && !isAdminUser) return alert("관리자만 삭제할 수 있습니다.");
        if (!data.isAdmin && data.password !== pwd && !isAdminUser) return alert("비밀번호가 일치하지 않습니다.");
        await deleteDoc(docRef);
      }
    } catch (e) { 
      console.error("삭제 에러:", e);
      alert("삭제 권한이 없습니다."); 
    }
  };

  async function processCommentSubmission(textContent, parentId, onSuccessCallback) {
    let docData = { postId: postId, parentId: parentId, content: textContent, createdAt: serverTimestamp(), isAdmin: false };
    const isAdminUser = currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL;

    if (isAdminUser) {
      docData.uid = currentUser.uid;
      docData.displayName = "카나코드";
      docData.isAdmin = true;
      /* photoURL 저장을 완전히 제거 (동적으로 그리기 때문) */
    } else {
      const nickname = document.getElementById(parentId ? `reply-nickname-${parentId}` : "anon-nickname")?.value.trim() || anonNickname.value.trim();
      const password = document.getElementById(parentId ? `reply-password-${parentId}` : "anon-password")?.value.trim() || anonPassword.value.trim();
      const email = document.getElementById(parentId ? `reply-email-${parentId}` : "anon-email")?.value.trim() || anonEmail.value.trim();

      if (!nickname || !password) return alert("닉네임과 비밀번호를 모두 입력해주세요.");

      let anonUid = currentUser ? currentUser.uid : null;
      if (!anonUid) {
        try {
          const userCredential = await signInAnonymously(auth);
          anonUid = userCredential.user.uid;
        } catch (e) { return alert("서버 통신에 실패했습니다."); }
      }
      docData.uid = anonUid;
      docData.displayName = nickname;
      docData.password = password;
      if (email) docData.email = email;
    }

    try { await addDoc(collection(db, "comments"), docData); if (onSuccessCallback) onSuccessCallback(); } 
    catch (error) { console.error(error); alert("댓글을 저장하는 중 오류가 발생했습니다."); }
  }

  submitBtn.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text) return alert("댓글 내용을 입력하세요.");

    let writerName = "익명 사용자";
    const isAdminUser = currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL;
    
    if (isAdminUser) { writerName = "카나코드"; } 
    else if (anonNickname && anonNickname.value.trim()) { writerName = anonNickname.value.trim(); }

    submitBtn.disabled = true; submitBtn.textContent = "등록 중...";

    await processCommentSubmission(text, null, async () => {
      textarea.value = "";
      if (anonNickname) anonNickname.value = "";
      if (anonPassword) anonPassword.value = "";
      if (anonEmail) anonEmail.value = "";

      try {
        if (!isAdminUser) {
          const templateParams = { to_email: ADMIN_EMAIL, to_name: "카나코드", reply_name: writerName, reply_content: text, post_link: window.location.href };
          await emailjs.send("service_n6vjcvi", "template_s4as7uj", templateParams);
        }
      } catch (e) { console.error("알림 발송 에러:", e); }
    });

    submitBtn.disabled = false; submitBtn.textContent = "댓글";
  });

  const q = query(collection(db, "comments"), where("postId", "==", postId), orderBy("createdAt", "asc"));

  let currentCommentLimit = 20; 
  const COMMENTS_PER_PAGE = 20; 
  let allParents = [];
  let allChildren = [];

  document.getElementById('btn-load-more').addEventListener('click', () => {
    currentCommentLimit += COMMENTS_PER_PAGE;
    renderCommentsList();
  });

  function renderCommentsList() {
    commentsList.innerHTML = "";
    
    if (allParents.length === 0) {
      commentsList.innerHTML = '<li class="comment-item" style="text-align: center; width:100%; padding: 30px; font-weight: 500; font-size: 0.95rem;">첫 번째 댓글을 남겨보세요!</li>';
      document.getElementById('load-more-container').style.display = 'none';
      return;
    }

    const parentsToShow = allParents.slice(0, currentCommentLimit);
    
    parentsToShow.forEach((data) => {
      const replies = allChildren.filter(c => c.parentId === data.id);
      renderComment(data, replies);
    });

    const loadMoreContainer = document.getElementById('load-more-container');
    if (allParents.length > currentCommentLimit) { loadMoreContainer.style.display = 'block'; } 
    else { loadMoreContainer.style.display = 'none'; }
  }

  onSnapshot(q, (snapshot) => {
    const allDocs = [];
    snapshot.forEach(doc => allDocs.push({ id: doc.id, ...doc.data() }));
    
    allParents = allDocs.filter(d => !d.parentId).reverse(); 
    allChildren = allDocs.filter(d => d.parentId);
    
    commentCountEl.textContent = allParents.length + allChildren.length;
    renderCommentsList();
  });

  function renderComment(data, replies) {
    const timeStr = timeAgo(data.createdAt ? data.createdAt.toDate() : null);
    
    const commentHtml = `
      <li class="comment-item" id="comment-${data.id}">
        <!-- 순수 CSS 기반 텍스트 아바타 적용 -->
        ${getAvatarHtml(data.isAdmin, data.displayName, false)}
        <div class="comment-content">
          <div class="comment-meta">
            ${data.isAdmin ? '<span class="badge-owner">작성자</span>' : ""}
            <span class="comment-author">${escapeHtml(data.displayName)}</span>
            <span class="comment-date">${timeStr}</span>
          </div>
          
          <div id="text-${data.id}" class="comment-text">${escapeHtml(data.content).replace(/\n/g, "<br>")}</div>
          
          <div class="edit-area" id="edit-area-${data.id}">
            <textarea class="comment-input" id="edit-input-${data.id}" rows="2">${escapeHtml(data.content)}</textarea>
            <div class="form-actions" style="margin-top:0.5rem; justify-content: flex-end;">
              <button class="btn-action-text" onclick="window.cancelEdit('${data.id}')" style="margin-right: 0.5rem;">취소</button>
              <button class="btn-submit" onclick="window.saveEdit('${data.id}')">저장</button>
            </div>
          </div>

          <div class="comment-actions">
            <button type="button" class="btn-action-text" onclick="window.toggleReplyForm('${data.id}')">답글</button>
            <button type="button" class="btn-action-text" onclick="window.startEdit('${data.id}')">수정</button>
            <button type="button" class="btn-action-text" onclick="window.confirmDelete('${data.id}')">삭제</button>
          </div>

          <div class="reply-form-wrapper" id="reply-form-${data.id}">
            <div style="display:flex; gap:0.5rem; flex-direction:column;">
              <div class="anonymous-inputs" style="${(currentUser && !currentUser.isAnonymous && currentUser.email === ADMIN_EMAIL) ? 'display:none;' : ''}">
                <input type="text" id="reply-nickname-${data.id}" class="anon-input" placeholder="닉네임" />
                <input type="password" id="reply-password-${data.id}" class="anon-input" placeholder="비밀번호" />
                <input type="email" id="reply-email-${data.id}" class="anon-input" placeholder="이메일 (답글 알림용, 선택)" />
              </div>
              <div style="display:flex; gap: 0.8rem;">
                ${getAvatarHtml(currentUser && currentUser.email === ADMIN_EMAIL, null, true)}
                <textarea class="comment-input" id="reply-input-${data.id}" placeholder="답글 추가..." rows="1" style="flex-grow:1;"></textarea>
              </div>
              <div class="form-actions" style="justify-content: flex-end;">
                <button class="btn-submit" onclick="window.submitReply('${data.id}')">답글 남기기</button>
              </div>
            </div>
          </div>

          ${replies.length > 0 ? `
            <div class="reply-container">
              ${replies.map(r => `
                  <div class="reply-item">
                    ${getAvatarHtml(r.isAdmin, r.displayName, true)}
                    <div style="flex-grow:1;">
                      <div class="comment-meta">
                        ${r.isAdmin ? '<span class="badge-owner">작성자</span>' : ""}
                        <span class="comment-author">${escapeHtml(r.displayName)}</span>
                        <span class="comment-date">${timeAgo(r.createdAt ? r.createdAt.toDate() : null)}</span>
                      </div>
                      <div id="text-${r.id}" class="comment-text">${escapeHtml(r.content).replace(/\n/g, "<br>")}</div>
                      
                      <div class="edit-area" id="edit-area-${r.id}">
                        <textarea class="comment-input" id="edit-input-${r.id}" rows="2">${escapeHtml(r.content)}</textarea>
                        <div class="form-actions" style="margin-top:0.5rem; justify-content: flex-end;">
                          <button class="btn-action-text" onclick="window.cancelEdit('${r.id}')" style="margin-right: 0.5rem;">취소</button>
                          <button class="btn-submit" onclick="window.saveEdit('${r.id}')">저장</button>
                        </div>
                      </div>

                      <div class="comment-actions">
                        <button type="button" class="btn-action-text" onclick="window.startEdit('${r.id}')">수정</button>
                        <button type="button" class="btn-action-text" onclick="window.confirmDelete('${r.id}')">삭제</button>
                      </div>
                    </div>
                  </div>
                `).join('')}
            </div>
          ` : ""}
        </div>
      </li>
    `;
    commentsList.insertAdjacentHTML("beforeend", commentHtml);
  }
</script>

<script>
  (function() {
    const commentsContainer = document.getElementById('custom-comments');
    const tailWrapper = document.getElementById('tail-wrapper');
    const siteFooter = tailWrapper ? tailWrapper.querySelector('footer') : null;
    
    if (commentsContainer && siteFooter) {
      siteFooter.parentNode.insertBefore(commentsContainer, siteFooter);
      commentsContainer.style.marginTop = '2.5rem';
      commentsContainer.style.marginBottom = '2.5rem';
    }
  })();
</script>
